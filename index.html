<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Тайм-менеджмент</title>
    <!-- Подключаем скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--hint-color);
            background-color: var(--secondary-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--button-color);
        }

        button#add-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background-color: var(--secondary-bg);
            border-radius: 10px;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .task-text {
            flex: 1;
            font-size: 16px;
            word-break: break-word;
            cursor: pointer;
        }

        li.completed .task-text {
            text-decoration: line-through;
            color: var(--hint-color);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
            margin-left: 10px;
        }

        .empty-state {
            text-align: center;
            color: var(--hint-color);
            margin-top: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Мои задачи</h1>

    <div class="input-container">
        <input type="text" id="task-input" placeholder="Что нужно сделать?">
        <button id="add-btn">+</button>
    </div>

    <ul id="task-list">
        <!-- Сюда будут добавляться задачи -->
    </ul>
    
    <div id="empty-state" class="empty-state">
        Пока нет задач. Добавьте первую! ✨
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.ready();  // Сообщаем Telegram, что приложение готово

        const taskInput = document.getElementById('task-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');

        // Загружаем задачи из памяти Telegram (CloudStorage) или localStorage
        let tasks = JSON.parse(localStorage.getItem('tg_tasks')) || [];

        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = task.text;
                // Клик по тексту - отметить выполненным
                span.onclick = () => toggleTask(index);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '✕';
                // Клик по крестику - удалить
                deleteBtn.onclick = () => deleteTask(index);

                li.appendChild(span);
                li.appendChild(deleteBtn);
                taskList.appendChild(li);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text: text, completed: false });
                taskInput.value = '';
                saveTasks();
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        function saveTasks() {
            localStorage.setItem('tg_tasks', JSON.stringify(tasks));
        }

        // Слушатели событий
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Первый запуск
        renderTasks();
    </script>
</body>
</html>
